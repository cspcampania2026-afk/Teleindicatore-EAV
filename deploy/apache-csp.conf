ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>
# Render terminates HTTPS at its proxy, which sets X-Forwarded-Proto.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
<Directory /var/www/html/deploy>
    Require all denied
</Directory>
<Directory /var/www/html/tests>
    Require all denied
</Directory>
<FilesMatch "^(Dockerfile|RENDER\.md|LEGGIMI\.md|COLLEGARE_TELEGRAM\.md|.*\.sqlite(?:-wal|-shm)?|.*\.zip|\.env.*)$">
    Require all denied
</FilesMatch>
